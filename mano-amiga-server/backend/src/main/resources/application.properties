# ------------------------------------------------------------------
# Mano Amiga API (Java). Los SECRETOS no van acá: se leen del mismo .env que usa la versión Node
# (mano-amiga-server/.env) o de las variables de entorno del servidor / Docker.
# ------------------------------------------------------------------
spring.application.name=mano-amiga-api
spring.main.banner-mode=off

# Lee ../.env (carpeta mano-amiga-server) si existe. El formato CLAVE=valor es compatible con .properties.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# En desarrollo la API escucha SOLO en la propia compu: el celular entra por el front-service (DMZ).
# En Docker se pone HOST=0.0.0.0 (la red interna de Docker hace de firewall).
server.port=${PORT:3000}
server.address=${HOST:127.0.0.1}
# Detrás del front-service: toma la IP real del cliente de X-Forwarded-For, pero SOLO si el pedido
# viene de una red interna (localhost / redes de Docker). Equivale a "trust proxy" de Express.
server.forward-headers-strategy=native
# Nunca mostrar stack traces ni mensajes internos al cliente.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false

# MongoDB: la misma base y colecciones que la versión Node (usuario con readWrite SOLO sobre mano_amiga).
spring.data.mongodb.uri=${MONGO_URI:}
spring.data.mongodb.auto-index-creation=true

# Rutas inexistentes -> 404 con el formato estándar (no servimos archivos estáticos).
spring.web.resources.add-mappings=false
spring.mvc.problemdetails.enabled=false

# JSON: fechas en ISO-8601 (2026-10-06T19:50:54.830Z) y campos desconocidos ignorados
# (los DTO de entrada son la lista blanca contra mass assignment).
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.time-zone=UTC

# Mensajes de validación siempre en español.
spring.web.locale=es
spring.web.locale-resolver=fixed

# Secretos y parámetros propios (se validan al arrancar: ver Configuracion.java)
manoamiga.jwt-secret=${JWT_SECRET:}
manoamiga.jwt-refresh-secret=${JWT_REFRESH_SECRET:}
manoamiga.qr-secret=${QR_SECRET:}
manoamiga.expo-access-token=${EXPO_ACCESS_TOKEN:}
manoamiga.bcrypt-costo=12
manoamiga.push-habilitado=true

logging.level.org.mongodb.driver=warn
