# Configuración SOLO para los tests: secretos de prueba (nunca se usan en producción).
# La base la define BaseIT (Testcontainers o MONGO_TEST_URI), nunca la de desarrollo.
manoamiga.jwt-secret=test-jwt-secret-solo-para-tests-0000000000
manoamiga.jwt-refresh-secret=test-refresh-secret-solo-para-tests-000000
manoamiga.qr-secret=test-qr-secret-solo-para-tests-00000000000
